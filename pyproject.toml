[project]
name = "emporio"
version = "0.1.0"
description = "Mel, the customer service agent of Empório da Música (Artefact AI Engineer challenge)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "holidays>=0.58",
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pypdf>=4.3",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
