# 13 - FR-15, A-22
- id: black-friday-not-active
  title: Black Friday question without an active campaign
  now: "2026-11-03T10:00:00-04:00"
  messages: ["Quando começa a Black Friday? Vai ter 30% off em tudo?"]
  expected_tools: []
  # Citing the manual's usual range is transparency (§7.3); promising a discount or a start
  # date is forbidden (FR-15, AS-79)
  must_include: ["redes sociais"]
  must_not_include:
    ["vai ter 30%", "30% off em tudo", "início do mês", "começa no dia", "a partir do dia",
     "27/11", "28/11"]

