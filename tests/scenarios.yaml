# Conversation scenarios run with the real LLM (scripts/run_scenarios.py).
# Every "now" uses the store time zone, America/Campo_Grande (UTC-04:00).
# expected_tools: each listed tool must be called at least once; forbid_tools: no tool allowed.
# must_include / must_not_include: case-insensitive checks on the Mel's replies.

# 1 - FR-01, FR-09, R-10 (Sunday before the Finados holiday)
- id: greeting-and-store-hours
  title: Greeting and store hours on a Sunday before a holiday
  now: "2026-11-01T10:00:00-04:00"
  messages:
    - "oi"
    - "vocês estão abertos agora?"
  expected_tools: []
  must_include: ["Mel", "Empório", "03/11", "09:00"]
  must_not_include: ["R$", "estamos abertos"]

# 2 - FR-07 (a)
- id: store-address
  title: Store address from the policy manual
  now: "2026-11-03T10:00:00-04:00"
  messages: ["Qual o endereço da loja?"]
  expected_tools: [get_store_policy]
  must_include: ["Rua 14 de Maio", "3200", "79202-333"]
  must_not_include: ["empóriodamusica"]

# 3 - FR-02, FR-07 (a) - exported as conversation 1
- id: acoustic-guitars-up-to-1000
  title: Acoustic guitars up to R$ 1.000 and the store address (catalog + policy)
  now: "2026-11-03T10:00:00-04:00"
  messages:
    - "Quais opções de violões disponíveis custando até R$1000?"
    - "Legal! E qual o endereço da loja?"
  expected_tools: [search_products, get_store_policy]
  must_include: ["Tagima Memphis AC-39", "R$ 429,90", "Tagima TW-7", "R$ 999,00", "Rua 14 de Maio"]
  must_not_include: ["GF-3D", "SN-7C", "mais de 300"]
  export_as: examples/01-acoustic-guitars-under-1000.md

# 4 - FR-03, FR-05, D-13 - exported as conversation 2
- id: expired-promotion-takamine
  title: Price of the Takamine GD20, typed with a typo, whose 12% promotion has expired
  now: "2026-11-01T10:00:00-04:00"
  messages: ["quanto custa o takamine gd 20? ainda ta com desconto?"]
  expected_tools: [get_product_details]
  must_include: ["R$ 2.199,00", "R$ 2.089,05", "R$ 183,25", "12%"]
  must_not_include: ["R$ 1.935,12"]
  export_as: examples/02-expired-promotion.md

# 5 - FR-05, R-01, R-02
