# 10 - FR-08, R-06, A-10, A-11 - exported as conversation 3
- id: regret-within-window
  title: Regret right within the 7-day window (identity check, deadline and conditions)
  now: "2026-02-20T10:00:00-04:00"
  messages:
    - "Me arrependi da minha compra, posso devolver meu pedido?"
    - "É o pedido 7, e-mail leticia.rocha@jmail.com. Comprei pelo site."
